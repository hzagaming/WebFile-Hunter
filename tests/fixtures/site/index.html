<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>WebFile Hunter 演示站</title>
    <link rel="stylesheet" href="/site.css" />
    <link rel="enclosure" type="audio/mpeg" href="/api/podcast" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoObject",
        "name": "结构化媒体夹具",
        "url": "/page-1.html",
        "contentUrl": "/api/structured-video",
        "thumbnailUrl": "/files/structured-poster.webp"
      }
    </script>
  </head>
  <body>
    <h1>WebFile Hunter 演示站</h1>
    <main>
      <p>该页面只包含测试占位资源。</p>
      <p id="public-text-fixture">WebFile Hunter 正文提取夹具 alpha beta beta</p>
    </main>
    <p hidden>hidden-text-secret</p>
    <p aria-hidden="true">aria-text-secret</p>
    <p style="display: none">display-text-secret</p>
    <input aria-label="隐私输入" value="input-text-secret" />
    <textarea aria-label="隐私文本框">textarea-text-secret</textarea>
    <div contenteditable="true">editable-text-secret</div>
    <div
      data-srcset="/files/lazy-small.webp 1x, /files/lazy-large.webp 2x"
      data-bg="/files/lazy-background.avif"
      data-file-url="/files/lazy-manual.pdf"
    ></div>
    <svg aria-hidden="true">
      <use href="/files/icons.svg#play"></use>
      <feImage href="/files/filter.png"></feImage>
    </svg>
    <a href="/files/sample.txt">示例文本</a>
    <a href="/files/document.pdf">示例 PDF</a>
    <a type="application/pdf" href="/api/typed-document">无后缀 PDF</a>
    <a itemprop="contentUrl" href="/api/itemprop-video">无后缀结构化视频</a>
    <audio controls src="/files/example.mp3"></audio>
    <img src="/files/pixel.png" alt="测试像素" />
    <template id="resource-template">
      <a type="application/pdf" href="/api/template-document">模板文档</a>
    </template>
    <a href="/page-1.html">第一页</a>
    <button id="load-audio" type="button">动态加载 MP3</button>
    <button id="load-api" type="button">请求无后缀文件</button>
    <script src="/site.js"></script>
  </body>
</html>
